# .github/workflows/update-data.yml
name: Update Brawl Stars data

on:
  repository_dispatch:
    types: [update-brawlstars]
  workflow_dispatch: {}
  # Fallback natif GH Actions, en plus du trigger cron-job.org
  schedule:
    - cron: "0 */6 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Brawl Stars stats
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          BS_PLAYER_TAG: ${{ secrets.BS_PLAYER_TAG }}
          BS_CLUB_TAG: ${{ secrets.BS_CLUB_TAG }}
        run: node fetch-brawlstars.js

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update brawlstars data.json"
          git push
